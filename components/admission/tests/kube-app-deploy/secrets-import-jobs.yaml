apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-import-admitted
  namespace: app-s4338-a1
  labels:
    mitstack.dev/app: s4338-a1
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        mitstack.dev/app: s4338-a1
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: check
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: [sh, -c, "exit 0"]
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
---
