apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: refused-require-strict-mtls-permissive
  namespace: mitstack-admission-probe
spec:
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: refused-require-strict-mtls-disable
  namespace: mitstack-admission-probe
spec:
  mtls:
    mode: DISABLE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: refused-require-strict-mtls-port
  namespace: mitstack-admission-probe
spec:
  selector:
    matchLabels:
      mitstack.dev/app: probe
  mtls:
    mode: STRICT
  portLevelMtls:
    8080:
      mode: PERMISSIVE
---
# The hosting set's exception is admitted by its namespace and name together, so the same name elsewhere is refused.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: mitstack-traefik-web
  namespace: mitstack-admission-probe
spec:
  selector:
    matchLabels:
      mitstack.dev/app: probe
  mtls:
    mode: STRICT
  portLevelMtls:
    8000:
      mode: PERMISSIVE
