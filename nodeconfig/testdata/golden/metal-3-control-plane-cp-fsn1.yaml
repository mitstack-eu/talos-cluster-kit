apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-metadata-block
manifest: |
    # Keeps every pod on the pod network from Hetzner's metadata service, which
    # serves each server's data. Default deny stays off in both directions, so
    # this policy drops that one address and isolates nothing else.
    apiVersion: cilium.io/v2
    kind: CiliumClusterwideNetworkPolicy
    metadata:
      name: mitstack-deny-hetzner-metadata
    spec:
      endpointSelector: {}
      enableDefaultDeny:
        egress: false
        ingress: false
      egressDeny:
        - toCIDR:
            - 169.254.169.254/32
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-require-app-label
manifest: |
    apiVersion: policies.kyverno.io/v1
    kind: ValidatingPolicy
    metadata:
      name: mitstack-require-app-label
      annotations:
        mitstack.dev/standard: NSA and CISA Kubernetes Hardening Guide
    spec:
      validationActions: [Deny]
      autogen:
        podControllers:
          controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs, replicasets]
      matchConstraints:
        resourceRules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE"]
          resources: ["pods"]
        namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, cnpg-system, mitstack-node, istio-system]
      validations:
      - expression: 'object.metadata.?labels[?"mitstack.dev/app"].orValue("") != ""'
        message: "mitstack-require-app-label: every pod must carry a non-empty mitstack.dev/app label, which the app's network policies select it by"
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-generate-default-deny
manifest: |
    apiVersion: policies.kyverno.io/v1
    kind: GeneratingPolicy
    metadata:
      name: mitstack-generate-default-deny
      annotations:
        mitstack.dev/standard: CIS Kubernetes Benchmark 5.3.2
    spec:
      evaluation:
        synchronize:
          enabled: true
        generateExisting:
          enabled: true
      matchConstraints:
        resourceRules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE"]
          resources: ["namespaces"]
      matchConditions:
      - name: not-a-system-namespace
        expression: "!(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'argocd', 'kyverno', 'cnpg-system', 'mitstack-node', 'istio-system'])"
      variables:
      - name: namespace
        expression: "string(object.metadata.name)"
      - name: defaultDeny
        expression: >-
          [{
            "apiVersion": dyn("networking.k8s.io/v1"),
            "kind": dyn("NetworkPolicy"),
            "metadata": dyn({"name": "mitstack-default-deny", "namespace": variables.namespace}),
            "spec": dyn({"podSelector": {}, "policyTypes": ["Ingress", "Egress"]})
          }]
      generate:
      - expression: generator.Apply(variables.namespace, variables.defaultDeny)
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: cloudnative-pg-namespace
manifest: |
    # The namespace the CloudNativePG operator runs in. Its pod meets the
    # restricted Pod Security Standard, so the namespace enforces it.
    apiVersion: v1
    kind: Namespace
    metadata:
      name: cnpg-system
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-database-slices
manifest: |
    apiVersion: cilium.io/v2
    kind: CiliumClusterwideNetworkPolicy
    metadata:
      name: mitstack-database-slices
    specs:
    - description: "A Postgres instance in a database slice reaches the API server and the other instances, and admits the operator on 8000 and every slice on 5432, each also on 15008, the port a mesh call arrives on."
      endpointSelector:
        matchLabels:
          k8s:io.cilium.k8s.namespace.labels.mitstack.dev/database-slice: "true"
          k8s:cnpg.io/podRole: instance
      egress:
      - toEntities: [kube-apiserver]
      - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.mitstack.dev/database-slice: "true"
            k8s:cnpg.io/podRole: instance
        toPorts:
        - ports: [{port: "5432", protocol: TCP}, {port: "15008", protocol: TCP}]
      ingress:
      - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            k8s:app.kubernetes.io/name: cloudnative-pg
        toPorts:
        - ports: [{port: "8000", protocol: TCP}, {port: "15008", protocol: TCP}]
      - fromEndpoints:
        - matchExpressions:
          - {key: k8s:io.cilium.k8s.namespace.labels.mitstack.dev/subscription, operator: Exists}
        toPorts:
        - ports: [{port: "5432", protocol: TCP}, {port: "15008", protocol: TCP}]
    - description: "A CloudNativePG Job in a database slice, such as initdb or join, reaches the API server and the instances on 5432 or 15008."
      endpointSelector:
        matchLabels:
          k8s:io.cilium.k8s.namespace.labels.mitstack.dev/database-slice: "true"
        matchExpressions:
        - {key: k8s:cnpg.io/jobRole, operator: Exists}
      egress:
      - toEntities: [kube-apiserver]
      - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.mitstack.dev/database-slice: "true"
            k8s:cnpg.io/podRole: instance
        toPorts:
        - ports: [{port: "5432", protocol: TCP}, {port: "15008", protocol: TCP}]
    - description: "A pod in any slice reaches the Postgres instances of a database slice on 5432 or 15008."
      endpointSelector:
        matchExpressions:
        - {key: k8s:io.cilium.k8s.namespace.labels.mitstack.dev/subscription, operator: Exists}
      egress:
      - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.mitstack.dev/database-slice: "true"
            k8s:cnpg.io/podRole: instance
        toPorts:
        - ports: [{port: "5432", protocol: TCP}, {port: "15008", protocol: TCP}]
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: local-path-provisioner-namespace
manifest: |
    # The provisioner's helper pods mount the node's user volume through hostPath to create and delete each claim's
    # directory, and only the privileged Pod Security Standard admits a hostPath volume.
    apiVersion: v1
    kind: Namespace
    metadata:
      name: local-path-storage
      labels:
        pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-local-path-flows
manifest: |
    # local-path-storage starts from mitstack-default-deny, and this names its pods' one flow, which the helper pods share.
    apiVersion: cilium.io/v2
    kind: CiliumClusterwideNetworkPolicy
    metadata:
      name: mitstack-local-path-flows
    specs:
    - description: "The local path provisioner reaches the API server."
      endpointSelector:
        matchLabels:
          k8s:io.kubernetes.pod.namespace: local-path-storage
      egress:
      - toEntities: [kube-apiserver]
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-strict-mtls
manifest: |
    # In istio-system with no selector, this is the mesh-wide policy: every pod in the mesh refuses a call that presents
    # no workload certificate.
    apiVersion: security.istio.io/v1
    kind: PeerAuthentication
    metadata:
      name: default
      namespace: istio-system
    spec:
      mtls:
        mode: STRICT
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-ambient-probes
manifest: |
    # Istio's CNI agent rewrites the source of the kubelet's health probes to 169.254.7.127, which Cilium does not read as
    # the node, so a default-deny namespace would drop them. Default deny stays off, so this opens that one source alone.
    apiVersion: cilium.io/v2
    kind: CiliumClusterwideNetworkPolicy
    metadata:
      name: mitstack-ambient-probes
    spec:
      endpointSelector: {}
      enableDefaultDeny:
        egress: false
        ingress: false
      ingress:
      - fromCIDR:
        - 169.254.7.127/32
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-mesh-cloudnative-pg
manifest: |
    # The API server holds no workload identity, so the operator's webhook port alone takes its calls without one.
    apiVersion: security.istio.io/v1
    kind: PeerAuthentication
    metadata:
      name: mitstack-cloudnative-pg-webhook
      namespace: cnpg-system
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
      mtls:
        mode: STRICT
      portLevelMtls:
        9443:
          mode: PERMISSIVE
    ---
    # Cilium sees a mesh call only on ztunnel's port 15008, so the ports it names for an instance are kept here: Postgres on
    # 5432, and the instance manager on 8000 for the operator alone.
    apiVersion: security.istio.io/v1
    kind: AuthorizationPolicy
    metadata:
      name: mitstack-database-instance-ports
      namespace: istio-system
    spec:
      selector:
        matchLabels:
          cnpg.io/podRole: instance
      action: DENY
      rules:
      - to:
        - operation:
            notPorts: ["5432", "8000"]
      - from:
        - source:
            notPrincipals: ["cluster.local/ns/cnpg-system/sa/cloudnative-pg"]
        to:
        - operation:
            ports: ["8000"]
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-mesh-argocd
manifest: |
    # Argo CD's chart admits each call to the repo server and Redis on its own port, and in the mesh that call arrives on
    # ztunnel's port 15008, so these admit 15008 from the same pods.
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: mitstack-argocd-repo-server-mesh
      namespace: argocd
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: argocd
          app.kubernetes.io/name: argocd-repo-server
      policyTypes: [Ingress]
      ingress:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-application-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-notifications-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-applicationset-controller
        ports:
        - port: 15008
          protocol: TCP
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: mitstack-argocd-redis-mesh
      namespace: argocd
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: argocd
          app.kubernetes.io/name: argocd-redis
      policyTypes: [Ingress]
      ingress:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-repo-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-application-controller
        ports:
        - port: 15008
          protocol: TCP
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-require-mesh
manifest: |
    apiVersion: policies.kyverno.io/v1
    kind: ValidatingPolicy
    metadata:
      name: mitstack-require-mesh
      annotations:
        mitstack.dev/standard: ADR 0095, mutual TLS with a workload identity
    spec:
      validationActions: [Deny]
      autogen:
        podControllers:
          controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs, replicasets]
      matchConstraints:
        resourceRules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE"]
          resources: ["pods"]
        namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, cnpg-system, mitstack-node, istio-system]
      validations:
      - expression: '!object.spec.?hostNetwork.orValue(false)'
        message: "mitstack-require-mesh: a pod on the host network stays outside the mesh, so it would take calls that carry no workload identity"
      - expression: '!object.metadata.?annotations[?"sidecar.istio.io/status"].hasValue()'
        message: "mitstack-require-mesh: Istio leaves a pod annotated sidecar.istio.io/status outside the mesh, so it would take calls that carry no workload identity"
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-require-strict-mtls
manifest: |
    apiVersion: policies.kyverno.io/v1
    kind: ValidatingPolicy
    metadata:
      name: mitstack-require-strict-mtls
      annotations:
        mitstack.dev/standard: ADR 0095, mutual TLS with a workload identity
    spec:
      validationActions: [Deny]
      matchConstraints:
        resourceRules:
        - apiGroups: ["security.istio.io"]
          apiVersions: ["*"]
          operations: ["CREATE", "UPDATE"]
          resources: ["peerauthentications"]
        namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, cnpg-system, mitstack-node, istio-system]
      # The hosting set's own policies open only the ports the API server and outside web clients call.
      matchConditions:
      - name: not-one-of-the-hosting-sets-own
        expression: >-
          !(object.metadata.namespace + "/" + object.metadata.name in [
            "cert-manager/mitstack-cert-manager-webhook", "cert-manager/mitstack-trust-manager-webhook",
            "external-secrets/mitstack-external-secrets-webhook", "traefik/mitstack-traefik-web"])
      variables:
      - name: plain
        expression: '["PERMISSIVE", "DISABLE"]'
      validations:
      - expression: '!(object.spec.?mtls.?mode.orValue("UNSET") in variables.plain)'
        message: "mitstack-require-strict-mtls: a PeerAuthentication may not let a pod take calls that carry no workload identity"
      - expression: 'object.spec.?portLevelMtls.orValue({}).all(port, !(object.spec.portLevelMtls[port].?mode.orValue("UNSET") in variables.plain))'
        message: "mitstack-require-strict-mtls: a PeerAuthentication may not let a pod's port take calls that carry no workload identity"
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: mitstack-node-logs
manifest: |
    # The node-local OpenTelemetry Collector. Talos sends its service and kernel
    # logs over plain TCP to the loopback address, where this Collector listens on
    # the host network, so the plain leg never leaves the machine. The Collector
    # exports over OTLP with TLS, verifying the receiver against the CA below.
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: mitstack-node-logs
      namespace: kube-system
    data:
      ca.crt: |
        -----BEGIN CERTIFICATE-----
        MIIBfTCCASOgAwIBAgIRAK9jqTYzeqEbNrSiKKYnJnUwCgYIKoZIzj0EAwIwHjEc
        MBoGA1UEAxMTbWl0c3RhY2sgZ2F0ZXdheSBDQTAeFw0yNjEwMjEwMDAwMDBaFw0z
        NjEwMTgwMDAwMDBaMB4xHDAaBgNVBAMTE21pdHN0YWNrIGdhdGV3YXkgQ0EwWTAT
        BgcqhkjOPQIBBggqhkjOPQMBBwNCAASj/MvZXAaQNrQNViex8nCA1qBHrQgjw6Qt
        Wn3M5tqT60Z0iV0SMJMtlor/fXmdDk54DPFeRc8PnzxgopFuvbV1o0IwQDAOBgNV
        HQ8BAf8EBAMCAgQwDwYDVR0TAQH/BAUwAwEB/zAdBgNVHQ4EFgQUFlwDtGpAiF4n
        2Vqh4rKhw/dAoPAwCgYIKoZIzj0EAwIDSAAwRQIgXdh7OsfIF18A1ZRr7Z5h9fAv
        VLfI9Qmhzejn6PODGnsCIQCfiV1evuUQSRT7oVbYcOQ9eQeBBoReIp+l8MSIqugT
        WQ==
        -----END CERTIFICATE-----
      config.yaml: |
        receivers:
          tcplog/service:
            listen_address: 127.0.0.1:5170
            operators:
              - type: json_parser
          tcplog/kernel:
            listen_address: 127.0.0.1:5171
            operators:
              - type: json_parser
        processors:
          batch: {}
        exporters:
          otlp_grpc:
            endpoint: otlp.mitstack.dev:4317
            tls:
              ca_file: /etc/mitstack-node-logs/ca.crt
        service:
          pipelines:
            logs:
              receivers: [tcplog/service, tcplog/kernel]
              processors: [batch]
              exporters: [otlp_grpc]
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: mitstack-node-logs
      namespace: kube-system
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: mitstack-node-logs
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mitstack-node-logs
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          priorityClassName: system-node-critical
          automountServiceAccountToken: false
          tolerations:
            - operator: Exists
          containers:
            - name: collector
              image: docker.io/otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
              args: [--config=/etc/mitstack-node-logs/config.yaml]
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - name: config
                  mountPath: /etc/mitstack-node-logs
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: mitstack-node-logs
