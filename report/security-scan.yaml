# The node report's security scan: a CronJob in kube-system, which Talos and Kyverno leave out of pod security, that
# runs kube-bench against its control-plane node and kubescape against the cluster's objects once a day, and patches a
# summary of each into one ConfigMap. The pod shares no process table with the node, so a first step, the reader,
# writes each control-plane component's command line from Talos's process list, and kube-bench reads each component's
# flags from those files and its config from the host, read-only. The etcd directory and the two directories that hold
# the scheduler's and the controller manager's kubeconfigs take no type check, since Talos's kubelet makes that check
# inside its own container, which holds none of them. Each kubeconfig's directory is mounted rather than the file, since
# the container runtime makes a directory at a host path that does not exist, and one where Talos writes a kubeconfig
# would stop it writing. The scan may read the cluster's objects but never a Secret, and read and patch that ConfigMap
# alone; the report may only read the ConfigMap and the CronJob, and list the namespace's events. The reader runs as a
# non-root user whose Talos identity holds os:reader alone, kube-bench after it as root with the host's files and no
# token, and kubescape last as a non-root user with the token and no host file, so no step holds two of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .ConfigMap }}
  namespace: {{ .Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mitstack-security-scan
  namespace: {{ .Namespace }}
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: mitstack-security-scan-processes
  namespace: {{ .Namespace }}
spec:
  roles:
    - os:reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mitstack-security-scan
rules:
  - apiGroups: [""]
    resources: [pods, services, serviceaccounts, configmaps, namespaces, nodes, persistentvolumes, persistentvolumeclaims,
      replicationcontrollers, limitranges, resourcequotas, endpoints]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mitstack-security-scan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mitstack-security-scan
subjects:
  - kind: ServiceAccount
    name: mitstack-security-scan
    namespace: {{ .Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mitstack-security-scan
  namespace: {{ .Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .ConfigMap }}]
    # kubectl patch reads the object before it patches it.
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mitstack-security-scan
  namespace: {{ .Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mitstack-security-scan
subjects:
  - kind: ServiceAccount
    name: mitstack-security-scan
    namespace: {{ .Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mitstack-node-report-security-scan
  namespace: {{ .Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .ConfigMap }}]
    verbs: [get]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [mitstack-security-scan]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    # A list cannot be limited to a name, so the report keeps from the namespace's events only those of the newest scan Job.
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mitstack-node-report-security-scan
  namespace: {{ .Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mitstack-node-report-security-scan
subjects:
  - kind: ServiceAccount
    name: mitstack-node-report
    namespace: {{ .ReportNamespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mitstack-security-scan
  namespace: {{ .Namespace }}
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        mitstack.dev/rendered-by: talos-cluster-kit
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mitstack-security-scan
        spec:
          serviceAccountName: mitstack-security-scan
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          initContainers:
            - name: processes
              image: {{ .Image }}
              terminationMessagePolicy: FallbackToLogsOnError
              command: [bash, {{ .Script }}, processes]
              env:
                - name: SCAN_RESULTS
                  value: /results
                - name: SCAN_PROCESSES
                  value: /processes
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                runAsUser: 65532
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: results
                  mountPath: /results
                - name: processes
                  mountPath: /processes
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
            - name: kube-bench
              image: {{ .Image }}
              terminationMessagePolicy: FallbackToLogsOnError
              command: [bash, {{ .Script }}, bench]
              env:
                - name: SCAN_RESULTS
                  value: /results
                - name: SCAN_BENCH_CONFIG
                  value: {{ .ScriptDir }}/kube-bench/cfg
                - name: SCAN_BENCH_VERSION
                  value: {{ .KubeBenchVersion }}
                - name: SCAN_PROCESSES
                  value: /processes
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                runAsUser: 0
                runAsNonRoot: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: results
                  mountPath: /results
                - name: processes
                  mountPath: /processes
                  readOnly: true
                - name: etc-kubernetes
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: kubelet
                  mountPath: /var/lib/kubelet
                  readOnly: true
                - name: etcd
                  mountPath: /var/lib/etcd
                  readOnly: true
                - name: scheduler-secrets
                  mountPath: {{ .SchedulerSecrets }}
                  readOnly: true
                - name: controller-manager-secrets
                  mountPath: {{ .ControllerManagerSecrets }}
                  readOnly: true
          containers:
            - name: scan
              image: {{ .Image }}
              terminationMessagePolicy: FallbackToLogsOnError
              command: [bash, {{ .Script }}]
              env:
                - name: SCAN_RESULTS
                  value: /results
                - name: SCAN_CONFIGMAP
                  value: {{ .Namespace }}/{{ .ConfigMap }}
                - name: KUBESCAPE_ARTIFACTS
                  value: {{ .ScriptDir }}/kubescape
                - name: KUBESCAPE_CONTROLS_VERSION
                  value: {{ .ControlsVersion }}
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                runAsUser: 65532
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: results
                  mountPath: /results
                - name: token
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: results
              emptyDir: {}
            - name: processes
              emptyDir: {}
            - name: talos-secrets
              secret:
                secretName: mitstack-security-scan-processes
            - name: token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            fieldPath: metadata.namespace
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
                type: Directory
            - name: kubelet
              hostPath:
                path: /var/lib/kubelet
                type: Directory
            - name: etcd
              hostPath:
                path: /var/lib/etcd
            - name: scheduler-secrets
              hostPath:
                path: {{ .SchedulerSecrets }}
            - name: controller-manager-secrets
              hostPath:
                path: {{ .ControllerManagerSecrets }}
