# OpenBao's members keep their Raft data on each node's user volume. Each volume is a local one pinned to its node and
# bound to one member's claim by name, so a member keeps its node, and the class provisions nothing. Retain keeps the
# data if the claim goes, where the default class local-path deletes it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openbao-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
{{- range $i, $node := .Nodes }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-data-{{ $i }}
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: openbao-local
  claimRef:
    namespace: openbao
    name: data-openbao-{{ $i }}
  local:
    path: {{ $.Path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ $node }}]
{{- end }}
