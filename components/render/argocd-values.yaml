global:
  image:
    repository: quay.io/argoproj/argocd
    tag: v3.5.5@sha256:13db7b10db23283b1b36f855046602e18539a8a8204c9f6f039e8896c8897518
dex:
  enabled: false
# Argo CD posts each Application's sync outcome to the platform. The enrolment writes argocd-notifications-secret, whose
# platform-url and platform-token Argo CD puts in for $platform-url and $platform-token, and Talos keeps whichever
# object it creates first, so the chart writes no Secret of its own.
notifications:
  secret:
    create: false
  notifiers:
    service.webhook.mitstack: |
      url: $platform-url/v1/gitops-notifications
      headers:
        - name: Authorization
          value: Bearer $platform-token
        - name: Content-Type
          value: application/json
  # The body sends the revision the operation synced, falling back to the compared one, and "" for the phase and
  # message of an Application with no operation.
  templates:
    template.mitstack: |
      webhook:
        mitstack:
          method: POST
          body: |
            {
              "app": {{toJson .app.metadata.name}},
              "project": {{toJson .app.spec.project}},
              "sync": {{toJson .app.status.sync.status}},
              "revision": {{toJson (dig "operationState" "syncResult" "revision" .app.status.sync.revision .app.status)}},
              "health": {{toJson .app.status.health.status}},
              "phase": {{toJson (dig "operationState" "phase" "" .app.status)}},
              "message": {{toJson (dig "operationState" "message" "" .app.status)}},
              "reconciledAt": {{toJson .app.status.reconciledAt}}
            }
  # on-deployed fires once per synced revision, so a resync of it posts nothing new.
  triggers:
    trigger.on-deployed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        oncePer: app.status.operationState?.syncResult?.revision
        send: [mitstack]
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [mitstack]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [mitstack]
  subscriptions:
    - recipients: [mitstack]
      triggers: [on-deployed, on-sync-failed, on-health-degraded]
redis:
  image:
    repository: public.ecr.aws/docker/library/redis
    tag: 8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
configs:
  cm:
    resource.customizations.health.argoproj.io_Application: 'local h=obj.status and obj.status.health or {} return {status=h.status or "Progressing",message=h.message or ""}'
    # Argo CD's built-in check reads a switchover, a failover, an upgrade and a configuration change as Degraded,
    # though CloudNativePG passes through each on its own, so here they read Progressing.
    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      local phases = {
        ["Cluster in healthy state"] = "Healthy",
        ["Setting up primary"] = "Progressing",
        ["Creating a new replica"] = "Progressing",
        ["Upgrading cluster"] = "Progressing",
        ["Waiting for the instances to become active"] = "Progressing",
        ["Promoting to primary cluster"] = "Progressing",
        ["Switchover in progress"] = "Progressing",
        ["Failing over"] = "Progressing",
        ["Upgrading Postgres major version"] = "Progressing",
        ["Online upgrade in progress"] = "Progressing",
        ["Applying configuration"] = "Progressing",
        ["Primary instance is being restarted in-place"] = "Progressing",
        ["Primary instance is being restarted without a switchover"] = "Progressing",
        ["Cluster upgrade delayed"] = "Degraded",
        ["Waiting for user action"] = "Degraded",
        ["Cluster cannot execute instance online upgrade due to missing architecture binary"] = "Degraded",
        ["Unable to create required cluster objects"] = "Suspended",
        ["Cluster cannot proceed to reconciliation due to an unknown plugin being required"] = "Suspended",
        ["Cluster has incomplete or invalid image catalog"] = "Suspended",
        ["Cluster is unrecoverable and needs manual intervention"] = "Suspended",
      }
      local annotations = obj.metadata and obj.metadata.annotations or {}
      if annotations["cnpg.io/reconciliationLoop"] == "disabled" then
        return {status = "Suspended", message = "Cluster reconciliation is suspended"}
      end
      local status = obj.status or {}
      for _, condition in ipairs(status.conditions or {}) do
        if condition.type == "cnpg.io/hibernation" then
          if condition.status == "True" then
            return {status = "Suspended", message = condition.message}
          end
          return {status = "Degraded", message = condition.message}
        end
      end
      if status.conditions == nil then
        return {status = "Progressing", message = status.phaseReason}
      end
      return {status = phases[status.phase] or "Unknown", message = status.phaseReason}
