ipam:
  mode: kubernetes
kubeProxyReplacement: true
# Istio's ambient mode needs both: its CNI plugin chains after Cilium's, and a pod's service calls reach ztunnel untranslated.
cni:
  exclusive: false
socketLB:
  hostNamespaceOnly: true
k8sServiceHost: localhost
k8sServicePort: 7445
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# Talos mounts the BPF filesystem at boot, so the chart's privileged init container that would mount it is left out.
bpf:
  autoMount:
    enabled: false
envoy:
  # The chart drops envoy's BPF mount along with the auto-mount, and envoy reads Cilium's connection and address maps there.
  extraHostPathMounts:
    - name: bpf-maps
      mountPath: /sys/fs/bpf
      hostPath: /sys/fs/bpf
      hostPathType: DirectoryOrCreate
      readOnly: false
      mountPropagation: HostToContainer
  # Envoy's starter needs NET_ADMIN and either SYS_ADMIN or BPF, and BPF is the narrower of the two.
  securityContext:
    capabilities:
      envoy: [NET_ADMIN, BPF]
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
operator:
  replicas: 1
nodeSelectorLabels: true
nodeLabels: node-role.kubernetes.io/control-plane
hubble:
  enabled: false
