# The node report: a CronJob that reads the cluster with the Talos os:reader
# role and a Kubernetes identity that may only read Nodes, pods, Applications,
# CloudNativePG's objects, claims, storage classes and the kinds of object a
# block labels with its subscription, never a Secret, and posts the result to
# the platform. It verifies OpenBao against the openbao-ca bundle that
# trust-manager copies into every namespace, and asks Argo CD's server its
# routes with no session. It asks each gateway's mirror under the gateway CA,
# whose certificate alone it carries, and opens a TLS connection to Let's
# Encrypt's ACME API through the network's default route, neither of which
# needs a rule here. It also creates the one namespace
# whose pods may hold a Talos identity. Its read of the API server's key set
# needs no rule here, since Kubernetes binds system:service-account-issuer-discovery
# to every service account by default. A Role lets the report mint a token for
# its own service account alone, which signs each report it posts. Another lets it list Argo CD's SealedSecrets, whose
# templates name each repository credential the cluster declares and whose data is ciphertext sealed to the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Namespace }}
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: mitstack-node-report
  namespace: {{ .Namespace }}
spec:
  roles:
    - os:reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mitstack-node-report
  namespace: {{ .Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mitstack-node-report
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, services, resourcequotas, limitranges]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [appprojects]
    verbs: [list]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, databases, databaseroles]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mitstack-node-report
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mitstack-node-report
subjects:
  - kind: ServiceAccount
    name: mitstack-node-report
    namespace: {{ .Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mitstack-node-report-sign
  namespace: {{ .Namespace }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [mitstack-node-report]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mitstack-node-report-sign
  namespace: {{ .Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mitstack-node-report-sign
subjects:
  - kind: ServiceAccount
    name: mitstack-node-report
    namespace: {{ .Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mitstack-node-report-credentials
  namespace: argocd
rules:
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mitstack-node-report-credentials
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mitstack-node-report-credentials
subjects:
  - kind: ServiceAccount
    name: mitstack-node-report
    namespace: {{ .Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mitstack-node-report
  namespace: {{ .Namespace }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 280
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mitstack-node-report
        spec:
          serviceAccountName: mitstack-node-report
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: {{ .Image }}
              command: [bash, {{ .Script }}]
              env:
                - name: REPORT_URL
                  value: {{ printf "%q" .ReportURL }}
                - name: SUBSCRIPTION_ID
                  value: {{ printf "%q" .SubscriptionID }}
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: REPORT_PROOF_SCRIPT
                  value: |
{{ indent 20 .ProofScript }}
                - name: MESH_PROBE_URL
                  value: {{ printf "%q" .MeshProbeURL }}
                - name: MESH_PROBE_ANSWER
                  value: {{ printf "%q" .MeshProbeAnswer }}
                - name: MESH_PROBE_IDENTITY
                  value: {{ printf "%q" .MeshProbeIdentity }}
                - name: MESH_PROBE_CONFIGMAP
                  value: {{ printf "%q" .MeshProbeConfigMap }}
                - name: OPENBAO_MEMBERS
                  value: {{ printf "%q" .OpenBaoMembers }}
                - name: OPENBAO_CA_FILE
                  value: /var/run/openbao-ca/ca.crt
                - name: ARGOCD_URL
                  value: https://argocd-server.argocd.svc
                - name: GATEWAYS
                  value: {{ printf "%q" .Gateways }}
                - name: GATEWAY_CA
                  value: {{ printf "%q" .GatewayCA }}
                - name: EGRESS_URL
                  value: {{ printf "%q" .EgressURL }}
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: report-token
                  mountPath: /var/run/mitstack
                  readOnly: true
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: openbao-ca
                  mountPath: /var/run/openbao-ca
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: report-token
              secret:
                secretName: {{ .TokenSecret }}
                defaultMode: 0440
            - name: talos-secrets
              secret:
                secretName: mitstack-node-report
            # A cluster without the hosting set has no OpenBao and no bundle, and its report names each failed read.
            - name: openbao-ca
              configMap:
                name: openbao-ca
                optional: true
