apiVersion: v1
kind: Pod
metadata:
  name: cloudnative-pg-pooler
  namespace: app-s4338-pg
  labels:
    cnpg.io/cluster: shared
    cnpg.io/poolerName: shared-pooler
    mitstack.dev/app: postgres
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: pgbouncer
    image: ghcr.io/cloudnative-pg/pgbouncer:1.25.2@sha256:b15c428057d1ffbc19fb70496911a5f1a47066dcc1315bf794f4e85ade29e2e5
    ports:
    - containerPort: 5432
      name: pgbouncer
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
