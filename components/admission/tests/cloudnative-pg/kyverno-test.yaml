apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cloudnative-pg
policies:
- ../../policies/mitstack-disallow-host-path.yaml
- ../../policies/mitstack-require-image-digest.yaml
- ../../policies/mitstack-require-resource-limits.yaml
- ../../policies/mitstack-restrict-image-registries.yaml
resources:
- operator.yaml
- instance.yaml
- pooler.yaml
- tagged.yaml
- unpinned.yaml
- archiving.yaml
- recovery.yaml
- sidecar-without-limits.yaml
- sidecar-other-release.yaml
- plugin.yaml
variables: values.yaml
results:
- isValidatingPolicy: true
  policy: mitstack-disallow-host-path
  kind: Pod
  resources:
  - cloudnative-pg-instance
  - cloudnative-pg-pooler
  - cloudnative-pg-instance-tagged
  - cloudnative-pg-instance-unpinned
  - cloudnative-pg-instance-archiving
  - cloudnative-pg-recovery
  - cloudnative-pg-instance-sidecar-without-limits
  - cloudnative-pg-instance-sidecar-other-release
  result: pass
- isValidatingPolicy: true
  policy: mitstack-require-resource-limits
  kind: Pod
  resources:
  - cloudnative-pg-instance
  - cloudnative-pg-pooler
  - cloudnative-pg-instance-tagged
  - cloudnative-pg-instance-unpinned
  - cloudnative-pg-instance-archiving
  - cloudnative-pg-recovery
  - cloudnative-pg-instance-sidecar-other-release
  result: pass
- isValidatingPolicy: true
  policy: mitstack-require-resource-limits
  kind: Pod
  resources:
  - cloudnative-pg-instance-sidecar-without-limits
  result: fail
- isValidatingPolicy: true
  policy: mitstack-restrict-image-registries
  kind: Pod
  resources:
  - cloudnative-pg-instance
  - cloudnative-pg-pooler
  - cloudnative-pg-instance-archiving
  - cloudnative-pg-recovery
  - cloudnative-pg-instance-sidecar-without-limits
  result: pass
- isValidatingPolicy: true
  policy: mitstack-restrict-image-registries
  kind: Pod
  resources:
  - cloudnative-pg-instance-tagged
  - cloudnative-pg-instance-unpinned
  - cloudnative-pg-instance-sidecar-other-release
  result: fail
- isValidatingPolicy: true
  policy: mitstack-disallow-host-path
  kind: Pod
  resources:
  - cloudnative-pg-operator
  - cloudnative-pg-barman-cloud-plugin
  result: skip
- isValidatingPolicy: true
  policy: mitstack-require-resource-limits
  kind: Pod
  resources:
  - cloudnative-pg-operator
  - cloudnative-pg-barman-cloud-plugin
  result: skip
- isValidatingPolicy: true
  policy: mitstack-restrict-image-registries
  kind: Pod
  resources:
  - cloudnative-pg-operator
  - cloudnative-pg-barman-cloud-plugin
  result: skip
- isValidatingPolicy: true
  policy: mitstack-require-image-digest
  kind: Pod
  resources:
  - cloudnative-pg-instance
  - cloudnative-pg-pooler
  - cloudnative-pg-instance-unpinned
  - cloudnative-pg-instance-archiving
  - cloudnative-pg-recovery
  - cloudnative-pg-instance-sidecar-without-limits
  - cloudnative-pg-instance-sidecar-other-release
  result: pass
- isValidatingPolicy: true
  policy: mitstack-require-image-digest
  kind: Pod
  resources:
  - cloudnative-pg-instance-tagged
  result: fail
- isValidatingPolicy: true
  policy: mitstack-require-image-digest
  kind: Pod
  resources:
  - cloudnative-pg-operator
  - cloudnative-pg-barman-cloud-plugin
  result: skip
