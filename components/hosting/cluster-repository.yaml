# Argo CD's credential for the cluster repository: its read-only deploy key, sealed in the strict scope to the boot key pair, with its URL in plain.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  encryptedData:
    {{ .Item }}: {{ .Sealed }}
  template:
    metadata:
      name: {{ .Name }}
      namespace: {{ .Namespace }}
      labels:
        argocd.argoproj.io/secret-type: repository
    data:
      type: git
      url: {{ .URL }}
