  - path: /etc/mitstack-gateway/Caddyfile
    content: |
      {
        admin off
        auto_https off
      }
      https://10.0.0.2:443 {
        bind 10.0.0.2
        tls /etc/mitstack-gateway/tls.crt /etc/mitstack-gateway/tls.key
        @pull method GET HEAD
        # route runs its directives as written, where handle would run respond before reverse_proxy.
        route /v2/* {
          reverse_proxy @pull 127.0.0.1:5000
          respond 405
        }
        handle_path /manifests/* {
          root * /srv/mitstack/manifests
          file_server
        }
        respond 404
      }
