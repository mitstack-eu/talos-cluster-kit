# The org's one runner scale set in ARC's dind mode, as the gha-runner-scale-set chart renders it for containerMode
# dind. Each job's pod mounts emptyDir volumes alone and reaches no cluster token. ARC's controller refuses a scale set
# whose version label differs from its own release.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Name }}-runner
  namespace: {{ .Namespace }}
  finalizers:
    - actions.github.com/cleanup-protection
automountServiceAccountToken: false
---
# ARC's controller creates each listener's Role and RoleBinding in this namespace, so it needs the chart's manager Role
# here; the finalizers hold the Role, its binding and the job pods' account until ARC has cleaned up the scale set.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Name }}-gha-rs-manager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/instance: {{ .Name }}
    app.kubernetes.io/version: {{ printf "%q" .ControllerVersion }}
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/component: manager-role
    actions.github.com/scale-set-name: {{ .Name }}
    actions.github.com/scale-set-namespace: {{ .Namespace }}
  finalizers:
    - actions.github.com/cleanup-protection
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, list, patch, update]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, delete, get, list, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, delete, get, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    verbs: [create, delete, get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Name }}-gha-rs-manager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/instance: {{ .Name }}
    app.kubernetes.io/version: {{ printf "%q" .ControllerVersion }}
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/component: manager-role-binding
    actions.github.com/scale-set-name: {{ .Name }}
    actions.github.com/scale-set-namespace: {{ .Namespace }}
  finalizers:
    - actions.github.com/cleanup-protection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Name }}-gha-rs-manager
subjects:
  - kind: ServiceAccount
    name: {{ .ControllerAccount }}
    namespace: {{ .Namespace }}
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/component: autoscaling-runner-set
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/instance: {{ .Name }}
    app.kubernetes.io/version: {{ printf "%q" .ControllerVersion }}
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: {{ .Name }}
    actions.github.com/scale-set-namespace: {{ .Namespace }}
  annotations:
    actions.github.com/cleanup-manager-role-name: {{ .Name }}-gha-rs-manager
    actions.github.com/cleanup-manager-role-binding: {{ .Name }}-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: {{ .Name }}-runner
spec:
  githubConfigUrl: {{ printf "%q" .ConfigURL }}
  githubConfigSecret: {{ .TokenSecret }}
  runnerGroup: {{ .Group }}
  runnerScaleSetName: {{ .Name }}
  minRunners: 0
  maxRunners: {{ .MaxRunners }}
  listenerTemplate:
    metadata:
      labels:
        mitstack.dev/app: {{ .Namespace }}
    # The listener holds the runner token, so it runs on the control plane, where no job's pod runs.
    spec:
      nodeSelector:
        {{ .ControlPlaneLabel }}: ""
      tolerations:
        - key: {{ .ControlPlaneLabel }}
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .BurstLabel }}
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listener
          image: {{ .ControllerImage }}
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  template:
    metadata:
      labels:
        mitstack.dev/app: {{ .Namespace }}
    # A job that escapes its pod reaches its node, so a job never runs on the control plane beside the runner token.
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .ControlPlaneLabel }}
                    operator: DoesNotExist
      restartPolicy: Never
      serviceAccountName: {{ .Name }}-runner
      automountServiceAccountToken: false
      initContainers:
        - name: init-dind-externals
          image: {{ .RunnerImage }}
          command: ["cp"]
          args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        - name: dind
          image: {{ .DindImage }}
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          # Requests make a queued job grow a Cloud pool, and with the runner's they fit one job on a cx23 beside every DaemonSet.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
      containers:
        - name: runner
          image: {{ .RunnerImage }}
          command:
            - /home/runner/run.sh
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
          resources:
            requests:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
      volumes:
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
        - name: work
          emptyDir: {}
