apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: acme-http01-solver
policies:
- ../../policies/mitstack-disallow-host-path.yaml
- ../../policies/mitstack-require-resource-limits.yaml
- ../../policies/mitstack-restrict-image-registries.yaml
resources:
- admitted.yaml
- other-digest.yaml
- control.yaml
variables: values.yaml
results:
- isValidatingPolicy: true
  policy: mitstack-disallow-host-path
  kind: Pod
  resources:
  - acme-http01-solver-admitted
  - acme-http01-solver-other-digest
  result: pass
- isValidatingPolicy: true
  policy: mitstack-require-resource-limits
  kind: Pod
  resources:
  - acme-http01-solver-admitted
  - acme-http01-solver-other-digest
  result: pass
- isValidatingPolicy: true
  policy: mitstack-restrict-image-registries
  kind: Pod
  resources:
  - acme-http01-solver-admitted
  result: pass
- isValidatingPolicy: true
  policy: mitstack-restrict-image-registries
  kind: Pod
  resources:
  - acme-http01-solver-other-digest
  result: fail
- isValidatingPolicy: true
  policy: mitstack-disallow-host-path
  kind: Pod
  resources:
  - control-in-cert-manager
  result: skip
- isValidatingPolicy: true
  policy: mitstack-require-resource-limits
  kind: Pod
  resources:
  - control-in-cert-manager
  result: skip
- isValidatingPolicy: true
  policy: mitstack-restrict-image-registries
  kind: Pod
  resources:
  - control-in-cert-manager
  result: skip
