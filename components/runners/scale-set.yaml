# The org's one runner scale set in ARC's dind mode, as the gha-runner-scale-set chart renders it for containerMode
# dind. Each job's pod mounts emptyDir volumes alone and reaches no cluster token. ARC's controller refuses a scale set
# whose version label differs from its own release.
{{- $npmrcDir := "/home/runner/npmrc" }}
{{- $npmrc := printf "%s/npmrc" $npmrcDir }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Name }}-runner
  namespace: {{ .Namespace }}
  finalizers:
    - actions.github.com/cleanup-protection
automountServiceAccountToken: false
---
# ARC's controller creates each listener's Role and RoleBinding in this namespace, so it needs the chart's manager Role
# here; the finalizers hold the Role, its binding and the job pods' account until ARC has cleaned up the scale set.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Name }}-gha-rs-manager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/instance: {{ .Name }}
    app.kubernetes.io/version: {{ printf "%q" .ControllerVersion }}
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/component: manager-role
    actions.github.com/scale-set-name: {{ .Name }}
    actions.github.com/scale-set-namespace: {{ .Namespace }}
  finalizers:
    - actions.github.com/cleanup-protection
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, list, patch, update]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, delete, get, list, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, delete, get, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    verbs: [create, delete, get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Name }}-gha-rs-manager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/instance: {{ .Name }}
    app.kubernetes.io/version: {{ printf "%q" .ControllerVersion }}
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/component: manager-role-binding
    actions.github.com/scale-set-name: {{ .Name }}
    actions.github.com/scale-set-namespace: {{ .Namespace }}
  finalizers:
    - actions.github.com/cleanup-protection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Name }}-gha-rs-manager
subjects:
  - kind: ServiceAccount
    name: {{ .ControllerAccount }}
    namespace: {{ .Namespace }}
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/component: autoscaling-runner-set
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/instance: {{ .Name }}
    app.kubernetes.io/version: {{ printf "%q" .ControllerVersion }}
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: {{ .Name }}
    actions.github.com/scale-set-namespace: {{ .Namespace }}
  annotations:
    actions.github.com/cleanup-manager-role-name: {{ .Name }}-gha-rs-manager
    actions.github.com/cleanup-manager-role-binding: {{ .Name }}-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: {{ .Name }}-runner
spec:
  githubConfigUrl: {{ printf "%q" .ConfigURL }}
  githubConfigSecret: {{ .TokenSecret }}
  runnerGroup: {{ .Group }}
  runnerScaleSetName: {{ .Name }}
  minRunners: 0
  maxRunners: {{ .MaxRunners }}
  listenerTemplate:
    metadata:
      labels:
        mitstack.dev/app: {{ .Namespace }}
    # The listener holds the runner token, so it runs on the control plane, where no job's pod runs.
    spec:
      nodeSelector:
        {{ .ControlPlaneLabel }}: ""
      tolerations:
        - key: {{ .ControlPlaneLabel }}
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .BurstLabel }}
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listener
          image: {{ .ControllerImage }}
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  template:
    metadata:
      labels:
        mitstack.dev/app: {{ .Namespace }}
      annotations:
        istio.io/reroute-virtual-interfaces: {{ printf "%q" .DockerBridges }}
    # A job that escapes its pod reaches its node, so a job never runs on the control plane beside the runner token.
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .ControlPlaneLabel }}
                    operator: DoesNotExist
      restartPolicy: Never
      serviceAccountName: {{ .Name }}-runner
      automountServiceAccountToken: false
{{- if .IsolateJobs }}
      # Each job's pod runs in its own user namespace, so root inside it is an unprivileged user on its node.
      hostUsers: false
{{- end }}
      # Each container's requests make a job that finds no room wait, so a Cloud pool that scales grows for it.
      initContainers:
        - name: init-dind-externals
          image: {{ .RunnerImage }}
          command: ["cp"]
          args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          resources:
            requests:
              cpu: {{ .InitSize.CPU }}
              memory: {{ .InitSize.Memory }}
            limits:
              cpu: {{ .InitSize.CPU }}
              memory: {{ .InitSize.Memory }}
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        # npm reads a project's .npmrc and the user npmrc setup-node writes before this global one, so a job that names
        # its own registry keeps it.
        - name: npmrc
          image: {{ .RunnerImage }}
          command: ["sh", "-c", "printf 'registry=%s\\n' \"$NPM_REGISTRY\" > \"$npm_config_globalconfig\""]
          env:
            - name: NPM_REGISTRY
              value: {{ printf "%q" .Caches.NPMRegistry }}
            - name: npm_config_globalconfig
              value: {{ $npmrc }}
          resources:
            requests:
              cpu: {{ .InitSize.CPU }}
              memory: {{ .InitSize.Memory }}
            limits:
              cpu: {{ .InitSize.CPU }}
              memory: {{ .InitSize.Memory }}
          volumeMounts:
            - name: npmrc
              mountPath: {{ $npmrcDir }}
        - name: dind
          image: {{ .DindImage }}
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
            - {{ printf "--registry-mirror=%s" .Caches.RegistryMirror | printf "%q" }}
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          resources:
            requests:
              cpu: {{ .DindSize.CPU }}
              memory: {{ .DindSize.Memory }}
            limits:
              cpu: {{ .DindSize.CPU }}
              memory: {{ .DindSize.Memory }}
          securityContext:
{{- if .IsolateJobs }}
            # The unprivileged daemon's settings in a user namespace; docs/runner-services.md gives each one's reason and which are unproven on Talos.
            privileged: false
            procMount: Unmasked
            capabilities:
              add: [SYS_ADMIN, NET_ADMIN, SYS_PTRACE]
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
{{- else }}
            privileged: true
{{- end }}
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
      containers:
        - name: runner
          image: {{ .RunnerImage }}
          command:
            - /home/runner/run.sh
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
            # The go command turns to the internet on any error of the Go cache, and npm has no such fallback.
            - name: GOPROXY
              value: {{ printf "%q" .Caches.GoProxy }}
            - name: npm_config_globalconfig
              value: {{ $npmrc }}
          resources:
            requests:
              cpu: {{ .RunnerSize.CPU }}
              memory: {{ .RunnerSize.Memory }}
            limits:
              cpu: {{ .RunnerSize.CPU }}
              memory: {{ .RunnerSize.Memory }}
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: npmrc
              mountPath: {{ $npmrcDir }}
              readOnly: true
      volumes:
        - name: npmrc
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
        - name: work
          emptyDir: {}
