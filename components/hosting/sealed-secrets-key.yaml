# The controller opens with every key pair in its namespace that carries the active label, and mints one of its own
# only when it finds none. Talos creates objects in name order after namespaces and CRDs, and this name sorts before
# the controller's, so the pair exists before the controller starts.
apiVersion: v1
kind: Secret
metadata:
  name: sealed-secrets-boot-key
  namespace: kube-system
  labels:
    sealedsecrets.bitnami.com/sealed-secrets-key: active
type: kubernetes.io/tls
stringData:
  tls.crt: |
{{ indent 4 .Cert }}
  tls.key: |
{{ indent 4 .Key }}
