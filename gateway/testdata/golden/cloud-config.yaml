  - path: /usr/local/bin/mitstack-gateway-prepare
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Prepares a gateway once its packages are installed: installs the talosctl
      # and kubectl that tools.env pins after checking their sha256, copies every
      # image of the mirror list into the local registry by digest with the skopeo
      # image tools.env pins, and fetches every served manifest, refusing one whose
      # sha256 differs from the list. Only then does it write the completion file,
      # which Caddy waits for. A copy that fails powers the gateway off, which the
      # plane reads from Hetzner as a failed mirror.
      # Usage: prepare.sh <tools.env> <images.txt> <manifests.txt> <manifest dir> <completion file>
      #   images.txt holds one name:tag@sha256:digest per line, and manifests.txt
      #   one "<file name> <sha256> <url>" per line. PREPARE_BIN_DIR names where the
      #   binaries go, /usr/local/bin by default.
      # It exists so the nodes pull and fetch only from the gateway, while the
      # gateway alone reaches the public registries, and only for pinned bytes.
      set -euo pipefail

      readonly registry=127.0.0.1:5000

      fail() {
        echo "prepare: $*" >&2
        exit 1
      }

      # fetch_checked <url> <sha256> <dest> <mode> writes a download only once its bytes match.
      fetch_checked() {
        local tmp
        tmp=$(mktemp)
        curl -fsSL --proto '=https' -o "$tmp" "$1"
        if ! echo "$2  $tmp" | sha256sum -c --quiet - > /dev/null 2>&1; then
          rm -f "$tmp"
          fail "$1 does not have sha256 $2"
        fi
        install -m "$4" "$tmp" "$3"
        rm -f "$tmp"
      }

      install_tools() {
        local bin_dir=${PREPARE_BIN_DIR:-/usr/local/bin}
        # shellcheck source=/dev/null
        . "$1"
        fetch_checked "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64" "$TALOSCTL_SHA256" "$bin_dir/talosctl" 0755
        fetch_checked "https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl" "$KUBECTL_SHA256" "$bin_dir/kubectl" 0755
      }

      # mirror_image <name:tag@digest> copies one image, its digest preserved, under its name and tag.
      mirror_image() {
        local ref=$1 name_tag digest
        name_tag=${ref%@*}
        digest=${ref##*@}
        if ! docker run --rm --network host "$SKOPEO_IMAGE" copy --all --preserve-digests --retry-times 3 --dest-tls-verify=false \
          "docker://${name_tag%:*}@${digest}" "docker://${registry}/${name_tag}"; then
          systemctl poweroff
          fail "$ref did not copy into the gateway's image mirror, so the gateway powers itself off"
        fi
      }

      main() {
        [ "$#" -eq 5 ] || fail "usage: prepare.sh <tools.env> <images.txt> <manifests.txt> <manifest dir> <completion file>"
        install_tools "$1"

        local ref file sha256 url
        while read -r ref; do
          if [ -n "$ref" ]; then
            mirror_image "$ref"
          fi
        done < "$2"
        mkdir -p "$4"
        while read -r file sha256 url; do
          if [ -n "$file" ]; then
            fetch_checked "$url" "$sha256" "$4/$file" 0644
          fi
        done < "$3"
        install -D -m 0644 /dev/null "$5"
        echo "prepare: the mirror and the manifests are in place"
      }

      main "$@"
  - path: /usr/local/bin/mitstack-talos-bootstrap
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Starts etcd on a cluster's first control-plane node from the gateway, either
      # empty or restored from a snapshot. After a restore it deletes every Node
      # object outside --keep, and on every exit it deletes the admin talosconfig and
      # the kubeconfig derived from it.
      # Usage: bootstrap.sh --node <address> --talosconfig <file> [--recover-from <snapshot> --keep <hostname>...]
      #   BOOTSTRAP_WAIT_ATTEMPTS and BOOTSTRAP_WAIT_SECONDS bound the wait for the
      #   restored API server, 60 attempts 5 seconds apart by default.
      # It exists because the bootstrap call accepts only the os:admin role, so the
      # credential lives on the gateway for this one call and never on a node, and
      # because a restore onto new servers stalls until the old Node objects go.
      set -euo pipefail

      node="" talosconfig="" snapshot="" keep=()
      work=""

      fail() {
        echo "bootstrap: $*" >&2
        exit 1
      }

      usage() {
        echo "usage: bootstrap.sh --node <address> --talosconfig <file> [--recover-from <snapshot> --keep <hostname>...]" >&2
        exit 2
      }

      cleanup() {
        [ -z "$talosconfig" ] || rm -f "$talosconfig"
        [ -z "$work" ] || rm -rf "$work"
      }

      parse_args() {
        while [ "$#" -gt 0 ]; do
          case $1 in
            --node) node=${2:?}; shift 2 ;;
            --talosconfig) talosconfig=${2:?}; shift 2 ;;
            --recover-from) snapshot=${2:?}; shift 2 ;;
            --keep) keep+=("${2:?}"); shift 2 ;;
            *) usage ;;
          esac
        done
        if [ -z "$node" ] || [ -z "$talosconfig" ]; then
          usage
        fi
        [ -z "$snapshot" ] || [ "${#keep[@]}" -gt 0 ] || fail "a restore needs --keep for each node of the new control plane"
      }

      talos() {
        talosctl --talosconfig "$talosconfig" -e "$node" -n "$node" "$@"
      }

      wait_for_api() {
        local attempts=${BOOTSTRAP_WAIT_ATTEMPTS:-60} attempt
        for ((attempt = 1; attempt <= attempts; attempt++)); do
          if kubectl --kubeconfig "$work/kubeconfig" get nodes -o name > "$work/nodes"; then
            return 0
          fi
          sleep "${BOOTSTRAP_WAIT_SECONDS:-5}"
        done
        fail "the restored API server did not answer after $attempts attempts"
      }

      kept() {
        local name
        for name in "${keep[@]}"; do
          [ "$name" = "$1" ] && return 0
        done
        return 1
      }

      delete_old_nodes() {
        local name
        while read -r name; do
          name=${name#node/}
          if kept "$name"; then
            continue
          fi
          kubectl --kubeconfig "$work/kubeconfig" delete node "$name"
          echo "bootstrap: deleted the old Node $name"
        done < "$work/nodes"
      }

      main() {
        trap cleanup EXIT
        parse_args "$@"
        [ -f "$talosconfig" ] || fail "no talosconfig at $talosconfig"

        if [ -z "$snapshot" ]; then
          talos bootstrap
          echo "bootstrap: started etcd on $node"
          return 0
        fi

        [ -f "$snapshot" ] || fail "no snapshot at $snapshot"
        talos bootstrap --recover-from="$snapshot"
        echo "bootstrap: restored etcd on $node from $snapshot"
        work=$(mktemp -d)
        talos kubeconfig "$work/kubeconfig" --force
        wait_for_api
        delete_old_nodes
      }

      main "$@"
  - path: /etc/systemd/system/mitstack-registry.service
    content: |
      [Unit]
      Description=The image mirror, reachable only from the gateway itself
      After=docker.service
      Requires=docker.service
      [Service]
      ExecStartPre=-/usr/bin/docker rm -f mitstack-registry
      ExecStart=/usr/bin/docker run --rm --name mitstack-registry --network host -e REGISTRY_HTTP_ADDR=127.0.0.1:5000 -v /var/lib/mitstack-registry:/var/lib/registry docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      Restart=always
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/mitstack-caddy.service
    content: |
      [Unit]
      Description=TLS for the mirror and the served manifests on the private network
      After=docker.service mitstack-registry.service
      Requires=docker.service
      ConditionPathExists=/var/lib/mitstack-gateway/mirror-complete
      [Service]
      ExecStartPre=-/usr/bin/docker rm -f mitstack-caddy
      ExecStart=/usr/bin/docker run --rm --name mitstack-caddy --network host -v /etc/mitstack-gateway:/etc/mitstack-gateway:ro -v /srv/mitstack/manifests:/srv/mitstack/manifests:ro docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy run --config /etc/mitstack-gateway/Caddyfile --adapter caddyfile
      Restart=always
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/mitstack-record-dns-ntp.service
    content: |
      [Unit]
      Description=Records every DNS and NTP packet the nodes send
      [Service]
      ExecStart=/usr/bin/tcpdump -n -i any -G 86400 -w /var/log/mitstack/dns-ntp-%%Y%%m%%d.pcap src net 10.0.0.0/16 and (port 53 or port 123)
      Restart=always
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/mitstack-record-flows.service
    content: |
      [Unit]
      Description=Records every new flow from the nodes
      [Service]
      ExecStart=/bin/sh -c 'exec /usr/sbin/conntrack -E -e NEW -s 10.0.0.0/16 -o timestamp >> /var/log/mitstack/flows.log'
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [mkdir, -p, /var/log/mitstack, /var/lib/mitstack-registry, /srv/mitstack/manifests]
  - [sysctl, --system]
  - [systemctl, enable, --now, nftables]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, mitstack-record-dns-ntp, mitstack-record-flows, mitstack-registry, mitstack-caddy]
  - [/usr/local/bin/mitstack-gateway-prepare, /etc/mitstack-gateway/tools.env, /etc/mitstack-gateway/images.txt, /etc/mitstack-gateway/manifests.txt, /srv/mitstack/manifests, /var/lib/mitstack-gateway/mirror-complete]
  - [systemctl, start, mitstack-caddy]
