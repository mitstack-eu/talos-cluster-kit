# OpenBao's init Job, whose namespace components/hosting/deploy-key.yaml creates, since the hosting set carries both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mitstack-openbao-init
  namespace: {{ .Namespace }}
data:
  recipient.asc: |
{{ indent 4 .Recipient }}
  known_hosts: |
{{ indent 4 .KnownHosts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mitstack-openbao-init
  namespace: {{ .Namespace }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mitstack-openbao-init
  namespace: {{ .Namespace }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitstack-openbao-init
        mitstack.dev/app: openbao
    spec:
      serviceAccountName: mitstack-openbao-init
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: {{ .Image }}
          command:
            - bash
            - -c
            - |
{{ indent 14 .Script }}
          env:
            - name: MITSTACK_OPENBAO_ADDR
              value: https://openbao-0.openbao-internal.openbao.svc:8200
            - name: MITSTACK_OPENBAO_CA
              value: /etc/mitstack/openbao-ca/ca.crt
            - name: MITSTACK_REPOSITORY_URL
              value: {{ printf "%q" .RepositoryURL }}
            - name: MITSTACK_RECIPIENT_FILE
              value: /etc/mitstack/init/recipient.asc
            - name: MITSTACK_KNOWN_HOSTS_FILE
              value: /etc/mitstack/init/known_hosts
            - name: MITSTACK_DEPLOY_KEY_FILE
              value: /etc/mitstack/deploy-key/{{ .DeployKeyItem }}
            - name: GNUPGHOME
              value: /tmp/gnupg
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /etc/mitstack/init
              readOnly: true
            - name: openbao-ca
              mountPath: /etc/mitstack/openbao-ca
              readOnly: true
            - name: deploy-key
              mountPath: /etc/mitstack/deploy-key
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: init
          configMap:
            name: mitstack-openbao-init
        - name: openbao-ca
          configMap:
            name: openbao-ca
        - name: deploy-key
          secret:
            secretName: {{ .DeployKeySecret }}
            defaultMode: 0440
