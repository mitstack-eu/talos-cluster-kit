apiVersion: v1
kind: Pod
metadata:
  name: cloudnative-pg-recovery
  namespace: app-s4338-pg
  labels:
    cnpg.io/cluster: shared
    cnpg.io/instanceName: shared-1
    cnpg.io/jobRole: full-recovery
    mitstack.dev/app: postgres
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: bootstrap-controller
    image: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
    command: [/manager, bootstrap, /controller/manager]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
    volumeMounts:
    - name: scratch-data
      mountPath: /controller
  - name: plugin-barman-cloud
    image: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
    args: [restore]
    restartPolicy: Always
    startupProbe:
      exec:
        command: [/manager, healthcheck, unix]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      privileged: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop: [ALL]
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
    volumeMounts:
    - name: plugins
      mountPath: /plugins
    - name: scratch-data
      mountPath: /controller
  containers:
  - name: full-recovery
    image: ghcr.io/cloudnative-pg/postgresql:16.15-system-trixie@sha256:8ca5699981c25db72e549e9fa69561bac233df15b9b1e3a6282847b0629bb5ea
    command: [/controller/manager, instance, restore]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
    volumeMounts:
    - name: pgdata
      mountPath: /var/lib/postgresql/data
    - name: scratch-data
      mountPath: /controller
    - name: plugins
      mountPath: /plugins
  volumes:
  - name: pgdata
    persistentVolumeClaim:
      claimName: shared-1
  - name: scratch-data
    emptyDir: {}
  - name: plugins
    emptyDir: {}
