# OpenBao's own authority signs through a namespaced Issuer, so only an object in openbao can obtain a certificate
# OpenBao's clients trust, and trust-manager copies that authority into the ConfigMap openbao-ca in every namespace.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-selfsigned
  namespace: openbao
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
  namespace: openbao
spec:
  isCA: true
  commonName: OpenBao CA
  secretName: openbao-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    kind: Issuer
    name: openbao-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-ca
  namespace: openbao
spec:
  ca:
    secretName: openbao-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: openbao
spec:
  secretName: openbao-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-active.openbao.svc
    - "*.openbao-internal"
    - "*.openbao-internal.openbao.svc"
    - "*.openbao-internal.openbao.svc.cluster.local"
  ipAddresses:
    - 127.0.0.1
  usages:
    - digital signature
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: Issuer
    name: openbao-ca
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: openbao-ca
spec:
  sources:
    - secret:
        name: openbao-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
---
# The webhook's certificate signs itself, and cert-manager's CA injector gives the API server that certificate.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  selfSigned: {}
---
# Each app slice's Ingress asks for this issuer by name. Its solver Service is ClusterIP, since a slice's quota allows no
# NodePort Service, and its pod carries the app label the admission policy requires.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            serviceType: ClusterIP
            podTemplate:
              metadata:
                labels:
                  mitstack.dev/app: acme-http01-solver
