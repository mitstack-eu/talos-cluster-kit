# An image of a repository the cluster's signer list names starts only with the keyless signature of that entry's
# issuer and subject. The policy names no ctlog, so Kyverno checks the log entry each signature carries against
# Sigstore's trust root and calls no log.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: mitstack-verify-image-signatures
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  # A background scan would read every signature again from the reports controller, which the egress limit below does not cover.
  evaluation:
    background:
      enabled: false
  validationConfigurations:
    mutateDigest: false
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, cnpg-system, mitstack-node, istio-system]
  matchImageReferences:
  - glob: "ghcr.io/mitstack-eu/talos-cluster-kit-tools:*"
  - glob: "ghcr.io/mitstack-eu/talos-cluster-kit-tools@*"
  - glob: "ghcr.io/kyverno/kyverno:*"
  - glob: "ghcr.io/kyverno/kyverno@*"
  attestors:
  - name: signer0
    cosign:
      keyless:
        identities:
        - issuer: "https://token.actions.githubusercontent.com"
          subject: "https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main"
  - name: signer1
    cosign:
      keyless:
        identities:
        - issuer: "https://token.actions.githubusercontent.com"
          subject: "https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main"
  variables:
  - name: images
    expression: "images.containers + images.initContainers + images.ephemeralContainers"
  validations:
  - expression: "variables.images.filter(i, i.startsWith('ghcr.io/mitstack-eu/talos-cluster-kit-tools:') || i.startsWith('ghcr.io/mitstack-eu/talos-cluster-kit-tools@')).all(i, verifyImageSignatures(i, [attestors.signer0]) > 0)"
    message: "mitstack-verify-image-signatures: an image of ghcr.io/mitstack-eu/talos-cluster-kit-tools must carry the keyless signature of https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main, issued by https://token.actions.githubusercontent.com"
  - expression: "variables.images.filter(i, i.startsWith('ghcr.io/kyverno/kyverno:') || i.startsWith('ghcr.io/kyverno/kyverno@')).all(i, verifyImageSignatures(i, [attestors.signer1]) > 0)"
    message: "mitstack-verify-image-signatures: an image of ghcr.io/kyverno/kyverno must carry the keyless signature of https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main, issued by https://token.actions.githubusercontent.com"
---
# kubectl debug adds an ephemeral container through an update of pods/ephemeralcontainers. Kyverno extends a policy to
# the controllers that make pods only while it names pods alone, so this second policy judges that update.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: mitstack-verify-image-signatures-ephemeral-containers
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  # A background scan would read every signature again from the reports controller, which the egress limit below does not cover.
  evaluation:
    background:
      enabled: false
  validationConfigurations:
    mutateDigest: false
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, cnpg-system, mitstack-node, istio-system]
  matchImageReferences:
  - glob: "ghcr.io/mitstack-eu/talos-cluster-kit-tools:*"
  - glob: "ghcr.io/mitstack-eu/talos-cluster-kit-tools@*"
  - glob: "ghcr.io/kyverno/kyverno:*"
  - glob: "ghcr.io/kyverno/kyverno@*"
  attestors:
  - name: signer0
    cosign:
      keyless:
        identities:
        - issuer: "https://token.actions.githubusercontent.com"
          subject: "https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main"
  - name: signer1
    cosign:
      keyless:
        identities:
        - issuer: "https://token.actions.githubusercontent.com"
          subject: "https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main"
  variables:
  - name: images
    expression: "images.containers + images.initContainers + images.ephemeralContainers"
  validations:
  - expression: "variables.images.filter(i, i.startsWith('ghcr.io/mitstack-eu/talos-cluster-kit-tools:') || i.startsWith('ghcr.io/mitstack-eu/talos-cluster-kit-tools@')).all(i, verifyImageSignatures(i, [attestors.signer0]) > 0)"
    message: "mitstack-verify-image-signatures: an image of ghcr.io/mitstack-eu/talos-cluster-kit-tools must carry the keyless signature of https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main, issued by https://token.actions.githubusercontent.com"
  - expression: "variables.images.filter(i, i.startsWith('ghcr.io/kyverno/kyverno:') || i.startsWith('ghcr.io/kyverno/kyverno@')).all(i, verifyImageSignatures(i, [attestors.signer1]) > 0)"
    message: "mitstack-verify-image-signatures: an image of ghcr.io/kyverno/kyverno must carry the keyless signature of https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main, issued by https://token.actions.githubusercontent.com"
