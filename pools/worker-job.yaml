# Step {{ .Step }} of the replacement of the Cloud worker {{ .Hostname }}. A
# drain evicts its pods under their disruption budgets, and a removal releases
# each claim on a local volume of it, then deletes its Node object. Each step
# may change only that one Node object.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Name }}
rules:
{{- if eq .Step "drain" }}
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [{{ printf "%q" .Hostname }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [{{ .Name }}]
    verbs: [get]
{{- else }}
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [{{ printf "%q" .Hostname }}]
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Name }}
    namespace: {{ .Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    mitstack.dev/rendered-by: talos-cluster-kit
spec:
  backoffLimit: {{ .BackoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: {{ .Name }}
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Step }}
          image: {{ .Image }}
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - bash
            - -c
            - |
{{ indent 14 .Script }}
          env:
            - name: STEP
              value: {{ .Step }}
            - name: NODE
              value: {{ printf "%q" .Hostname }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JOB
              value: {{ .Name }}
            - name: JOB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATTEMPTS
              value: "{{ .Attempts }}"
            - name: DRAIN_TIMEOUT
              value: {{ .DrainTimeout }}
            - name: SERVICE_ACCOUNT_DIR
              value: /var/run/secrets/kubernetes.io/serviceaccount
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
