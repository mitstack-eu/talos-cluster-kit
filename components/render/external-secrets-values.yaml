# cert-manager issues the webhook's certificate, so the chart renders no Secret of its own and needs no cert controller.
webhook:
  podLabels:
    mitstack.dev/app: external-secrets-webhook
  image:
    tag: v2.11.0@sha256:66fb710878cbf3eba4a927e35c5d75e29a202c9bab238aad64bfb23b786b962b
  certManager:
    enabled: true
    cert:
      issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: external-secrets-webhook
certController:
  create: false
