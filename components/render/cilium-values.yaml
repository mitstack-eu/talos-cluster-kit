ipam:
  mode: kubernetes
kubeProxyReplacement: true
# Istio's ambient mode needs both: its CNI plugin chains after Cilium's, and a pod's service calls reach ztunnel untranslated.
cni:
  exclusive: false
socketLB:
  hostNamespaceOnly: true
k8sServiceHost: localhost
k8sServicePort: 7445
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
operator:
  replicas: 1
nodeSelectorLabels: true
nodeLabels: node-role.kubernetes.io/control-plane
hubble:
  enabled: false
