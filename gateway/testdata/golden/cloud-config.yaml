#cloud-config
# A cluster's gateway, an Ubuntu 24.04 Cloud server with the only public
# address of the cluster. It forwards the nodes' DNS, NTP and HTTPS, and HTTP
# to the ingress load balancer alone, and drops every other flow. It records
# each DNS and NTP packet and each new flow, serves the image mirror and the
# served manifests over TLS on the private network, and holds the etcd
# bootstrap script. nftables.conf is its whole firewall:
# Docker writes no rule and runs every container on the host network.
package_update: true
packages: [docker.io, nftables, tcpdump, conntrack, curl]
write_files:
  - path: /etc/docker/daemon.json
    content: |
      {"iptables": false, "ip6tables": false, "bridge": "none"}
  - path: /etc/sysctl.d/90-mitstack-gateway.conf
    content: |
      net.ipv4.ip_forward = 1
  - path: /etc/nftables.conf
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      table inet mitstack-gateway {
        chain input {
          type filter hook input priority filter; policy drop;
          iif lo accept
          ct state established,related accept
          ip saddr 10.0.0.0/16 ip daddr 10.0.0.2 tcp dport 443 accept
          ip saddr 10.0.0.0/16 icmp type echo-request accept
        }
        chain forward {
          type filter hook forward priority filter; policy drop;
          ct state established,related accept
          ip saddr 10.0.0.0/16 ip daddr { 185.12.64.1, 185.12.64.2 } meta l4proto { tcp, udp } th dport 53 accept
          ip saddr 10.0.0.0/16 udp dport 123 accept
          ip saddr 10.0.0.0/16 tcp dport { 443, 4317 } accept
          ip saddr 10.0.0.0/16 ip daddr 198.51.100.7 tcp dport 80 accept
        }
      }
      table ip mitstack-gateway-nat {
        chain postrouting {
          type nat hook postrouting priority srcnat;
          ip saddr 10.0.0.0/16 ip daddr != 10.0.0.0/16 masquerade
        }
      }
