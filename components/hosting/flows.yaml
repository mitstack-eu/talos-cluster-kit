# Each hosting namespace starts from mitstack-default-deny, so these name the only flows its pods make or take.
# A call between two pods arrives on ztunnel's port 15008 in the mesh, so each such flow admits 15008 beside its port.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: mitstack-hosting-flows
specs:
- description: "cert-manager, its CA injector and trust-manager reach the API server, which reaches their webhooks. cert-manager looks names up through Cilium's DNS proxy, reaches Let's Encrypt's production and staging ACME APIs on 443, AWS STS and Route 53 on 443 for a slice's DNS-01 issuer, and makes its HTTP-01 self-check to an app's hostname on 80."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: cert-manager
  egress:
  - toEntities: [kube-apiserver]
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: acme-v02.api.letsencrypt.org
    - matchName: acme-staging-v02.api.letsencrypt.org
    - matchName: sts.amazonaws.com
    - matchPattern: "sts.*.amazonaws.com"
    - matchName: route53.amazonaws.com
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
  - toFQDNs:
    - matchPattern: "*.apps.mitstack.dev"
    toPorts:
    - ports: [{port: "80", protocol: TCP}]
  ingress:
  - fromEntities: [kube-apiserver]
    toPorts:
    - ports: [{port: "10250", protocol: TCP}, {port: "6443", protocol: TCP}]
  - fromNodes:
    - matchLabels:
        node-role.kubernetes.io/control-plane: ""
    toPorts:
    - ports: [{port: "10250", protocol: TCP}, {port: "6443", protocol: TCP}]
- description: "External Secrets reaches the API server and OpenBao, looks names up through Cilium's DNS proxy, and reaches AWS STS and ECR's API on 443 for its ECR token generator, and the API server reaches its webhook."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: external-secrets
  egress:
  - toEntities: [kube-apiserver]
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
      rules:
        dns:
        - matchPattern: "*"
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: openbao
        k8s:app.kubernetes.io/name: openbao
    toPorts:
    - ports: [{port: "8200", protocol: TCP}, {port: "15008", protocol: TCP}]
  - toFQDNs:
    - matchName: sts.amazonaws.com
    - matchPattern: "sts.*.amazonaws.com"
    - matchPattern: "api.ecr.*.amazonaws.com"
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
  ingress:
  - fromEntities: [kube-apiserver]
    toPorts:
    - ports: [{port: "10250", protocol: TCP}]
  - fromNodes:
    - matchLabels:
        node-role.kubernetes.io/control-plane: ""
    toPorts:
    - ports: [{port: "10250", protocol: TCP}]
- description: "OpenBao's members reach each other and the API server, External Secrets, the init Job and the node report reach their API, and the telemetry Collector's cluster copy reaches their metrics listener from outside the mesh."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: openbao
      k8s:app.kubernetes.io/name: openbao
  egress:
  - toEntities: [kube-apiserver]
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: openbao
        k8s:app.kubernetes.io/name: openbao
    toPorts:
    - ports: [{port: "8200", protocol: TCP}, {port: "8201", protocol: TCP}, {port: "15008", protocol: TCP}]
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: openbao
        k8s:app.kubernetes.io/name: openbao
    toPorts:
    - ports: [{port: "8200", protocol: TCP}, {port: "8201", protocol: TCP}, {port: "15008", protocol: TCP}]
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: external-secrets
        k8s:app.kubernetes.io/name: external-secrets
    toPorts:
    - ports: [{port: "8200", protocol: TCP}, {port: "15008", protocol: TCP}]
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: mitstack-node
        k8s:app.kubernetes.io/name: mitstack-openbao-init
    toPorts:
    - ports: [{port: "8200", protocol: TCP}, {port: "15008", protocol: TCP}]
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: mitstack-node
        k8s:app.kubernetes.io/name: mitstack-node-report
    toPorts:
    - ports: [{port: "8200", protocol: TCP}, {port: "15008", protocol: TCP}]
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:app.kubernetes.io/name: mitstack-telemetry-cluster
    toPorts:
    - ports: [{port: "9101", protocol: TCP}]
- description: "OpenBao's init Job looks names up through Cilium's DNS proxy, reaches OpenBao, and reaches GitHub's SSH endpoint on 443, which the gateway forwards."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: mitstack-node
      k8s:app.kubernetes.io/name: mitstack-openbao-init
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
      rules:
        dns:
        - matchPattern: "*"
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: openbao
        k8s:app.kubernetes.io/name: openbao
    toPorts:
    - ports: [{port: "8200", protocol: TCP}, {port: "15008", protocol: TCP}]
  - toFQDNs:
    - matchName: ssh.github.com
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
- description: "OpenBao's rollout Job reaches the API server alone, which serves its reads and evictions and runs its reads inside a member, so it needs no flow to OpenBao."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: openbao
      k8s:app.kubernetes.io/name: mitstack-openbao-rollout
  egress:
  - toEntities: [kube-apiserver]
- description: "Traefik takes web traffic from the load balancers on its NodePorts, reaches the API server, and reaches the app slices."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: traefik
  ingress:
  - fromEntities: [world]
    toPorts:
    - ports: [{port: "8000", protocol: TCP}, {port: "8443", protocol: TCP}]
  egress:
  - toEntities: [kube-apiserver]
  - toEndpoints:
    - matchExpressions:
      - {key: k8s:io.cilium.k8s.namespace.labels.mitstack.dev/subscription, operator: Exists}
---
# External Secrets reads SSM parameters through this policy alone, so deleting it takes that reach back whole.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mitstack-external-secrets-ssm
  namespace: external-secrets
spec:
  description: "External Secrets reaches AWS SSM's regional API on 443."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: external-secrets
  egress:
  - toFQDNs:
    - matchPattern: "ssm.*.amazonaws.com"
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
