apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: mitstack-require-image-digest
  annotations:
    mitstack.dev/standard: NSA and CISA Kubernetes Hardening Guide
spec:
  validationActions: [Deny]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs, replicasets]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, cnpg-system, mitstack-node, istio-system]
  variables:
  - name: containers
    expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"
  validations:
  - expression: "variables.containers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$'))"
    message: "mitstack-require-image-digest: every container, init container and ephemeral container must name its image by its sha256 digest, so a moved tag never changes what runs"
---
# kubectl debug adds an ephemeral container through an update of pods/ephemeralcontainers. Kyverno extends a policy to
# the controllers that make pods only while it names pods alone, so this second policy judges that update.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: mitstack-require-image-digest-ephemeral-containers
  annotations:
    mitstack.dev/standard: NSA and CISA Kubernetes Hardening Guide
spec:
  validationActions: [Deny]
  # A background scan would list pods/ephemeralcontainers, which the API serves no list of, and leave the policy not ready.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, cnpg-system, mitstack-node, istio-system]
  variables:
  - name: containers
    expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"
  validations:
  - expression: "variables.containers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$'))"
    message: "mitstack-require-image-digest: every container, init container and ephemeral container must name its image by its sha256 digest, so a moved tag never changes what runs"
