# OpenBao's init Job, in the namespace the hosting GitHub App's key opens in: it initialises OpenBao once, commits the
# root token and the recovery key to the cluster repository as PGP messages to the recipient key, and only then sets
# OpenBao up with the root token it holds in memory. The namespace comes from components/hosting/sealed-app-key.yaml,
# which the hosting set always carries beside this manifest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mitstack-openbao-init
  namespace: {{ .Namespace }}
data:
  recipient.asc: |
{{ indent 4 .Recipient }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mitstack-openbao-init
  namespace: {{ .Namespace }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mitstack-openbao-init
  namespace: {{ .Namespace }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitstack-openbao-init
        mitstack.dev/app: openbao
    spec:
      serviceAccountName: mitstack-openbao-init
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: {{ .Image }}
          command:
            - bash
            - -c
            - |
{{ indent 14 .Script }}
          env:
            - name: MITSTACK_OPENBAO_ADDR
              value: https://openbao-0.openbao-internal.openbao.svc:8200
            - name: MITSTACK_OPENBAO_CA
              value: /etc/mitstack/openbao-ca/ca.crt
            - name: MITSTACK_GITHUB_API_URL
              value: https://api.github.com
            - name: MITSTACK_REPOSITORY
              value: {{ printf "%q" .Repository }}
            - name: MITSTACK_GITHUB_APP_ID
              value: {{ printf "%q" .AppID }}
            - name: MITSTACK_GITHUB_INSTALLATION_ID
              value: {{ printf "%q" .InstallationID }}
            - name: MITSTACK_RECIPIENT_FILE
              value: /etc/mitstack/recipient/recipient.asc
            - name: MITSTACK_APP_KEY_FILE
              value: /etc/mitstack/github-app/{{ .AppKeyItem }}
            - name: GNUPGHOME
              value: /tmp/gnupg
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: recipient
              mountPath: /etc/mitstack/recipient
              readOnly: true
            - name: openbao-ca
              mountPath: /etc/mitstack/openbao-ca
              readOnly: true
            - name: github-app
              mountPath: /etc/mitstack/github-app
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: recipient
          configMap:
            name: mitstack-openbao-init
        - name: openbao-ca
          configMap:
            name: openbao-ca
        - name: github-app
          secret:
            secretName: {{ .AppKeySecret }}
            defaultMode: 0440
