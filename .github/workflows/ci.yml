# Every event runs the Go suites, a copy through the gateway's own skopeo
# into its own registry, the check that each vendored component matches a
# fresh render of its pinned chart, the Kyverno policy tests, shellcheck over
# every script, and a build of the tools image.
# Once all of them pass on a push to main, the release job releases the
# version .github/version names, unless that tag exists already, and the
# record delivery job records the push's board keys on Plain. A block takes a
# change only by requiring a newer tag in its go.mod.
# A release pushes the tools image to the public package
# ghcr.io/mitstack-eu/talos-cluster-kit-tools and signs its digest keyless.
# A digest cannot sit in the commit its image is built from, so the job tags
# a commit on top of main's that writes the reference into tools.Image, and
# main's tools.Image names no published image.
name: Module CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: go vet
        run: go vet ./...

      # The script suites run bash, curl, jq, gpg and openssl from the runner's image.
      # On two cores the controlplane suite runs close to go test's default ten-minute timeout.
      - name: go test
        run: go test -race -timeout 25m ./...

      # It pulls trust-manager from quay.io into the gateway's registry image through Docker, so it runs here alone.
      - name: mirror check
        if: ${{ !cancelled() }}
        run: go test -tags mirror -count=1 -run '^TestPrepareScript_Mirrors' ./gateway/

  components:
    name: components
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install helm v3.18.6
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
          echo "3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: Check every component against a fresh render
        run: scripts/render-components.sh --check

      - name: Install the Kyverno CLI v1.19.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o kyverno-cli.tar.gz \
            https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz
          echo "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae  kyverno-cli.tar.gz" | sha256sum -c -
          tar -xzf kyverno-cli.tar.gz kyverno
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test the admission policies
        run: kyverno test components/admission/tests

      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh etcd/scripts/*.sh gateway/scripts/*.sh report/scripts/*.sh openbaoinit/scripts/*.sh controlplane/scripts/*.sh

  tools-image:
    name: tools image
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the tools image
        run: docker build -t talos-tools:ci tools

      - name: Run each of its commands
        run: |
          set -euo pipefail
          docker run --rm talos-tools:ci bash --version
          docker run --rm talos-tools:ci jq --version
          docker run --rm talos-tools:ci curl --version
          docker run --rm talos-tools:ci gpg --version
          docker run --rm talos-tools:ci openssl version
          docker run --rm talos-tools:ci talosctl version --client --short
          docker run --rm talos-tools:ci kubectl version --client

  pr-key-gate:
    name: pr key gate
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base..head range needs history a shallow checkout has not
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      # The title comes through the environment, since a pull request's title is text its author controls.
      - name: Gate the pull request on a board key
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run github.com/mitstack-eu/plain-delivery/cmd/pr-keys@v0.1.0 --repo . --base "$BASE_SHA" --head "$HEAD_SHA"

  release:
    name: release
    needs: [test, components, tools-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    permissions:
      contents: write
      packages: write
      id-token: write # cosign's keyless signature
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TOOLS_PACKAGE: ghcr.io/mitstack-eu/talos-cluster-kit-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version .github/version names
        id: version
        run: |
          set -euo pipefail
          tag="v$(cat .github/version)"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.github/version holds $tag, want MAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag exists at $(git rev-list -n 1 "$tag"), so nothing is released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.release == 'true'
        with:
          go-version: '1.26.10'

      - name: Install cosign v2.5.3
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.5.3/cosign-linux-amd64
          echo "783b5d6c74105401c63946c68d9b2a4e1aab3c8abce043e06b8510b02b623ec9  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Push the tools image and sign its digest
        id: image
        if: steps.version.outputs.release == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$TOOLS_PACKAGE:$TAG" --metadata-file "$RUNNER_TEMP/build.json" tools
          ref="$TOOLS_PACKAGE:$TAG@$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")"
          cosign sign --yes "$ref"
          docker logout ghcr.io
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pushed and signed $ref"

      # The gateway copies the image into a cluster's mirror with no credential, so a release needs a public package.
      - name: Verify the signature and pull the image with no login
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/mitstack-eu/talos-cluster-kit/.github/workflows/ci.yml@refs/heads/main \
            "$REF" > /dev/null
          docker image rm "${REF%@*}" # the push left a local copy, which the pull must not read
          docker pull "$REF"
          gh api "orgs/mitstack-eu/packages/container/${TOOLS_PACKAGE##*/}" --jq '{name, visibility, created_at}'

      - name: Tag a commit on top of this one that pins the image in tools.Image
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          sed -i "s|^const Image = \".*\"$|const Image = \"$REF\"|" tools/tools.go
          grep -qxF "const Image = \"$REF\"" tools/tools.go
          go test ./tools
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$TAG: pin the tools image $REF" tools/tools.go
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "released $TAG at $(git rev-parse HEAD), on top of $GITHUB_SHA"

  # A push that cuts no tag still delivers its keys, so this needs both jobs to succeed and reads no output of release.
  record-delivery:
    name: record delivery
    needs: [test, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    # It pushes the board-synced anchor tag it advances.
    permissions:
      contents: write
    concurrency:
      group: record-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # range resolution reads the board-synced tag and history a shallow checkout has neither

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: Record this push's delivered board keys
        env:
          TRACKER_BASE_URL: ${{ vars.TRACKER_BASE_URL }}
          TRACKER_API_TOKEN: ${{ secrets.TRACKER_API_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: go run github.com/mitstack-eu/plain-delivery/cmd/board-delivery@v0.1.0 --repo . --before "$BEFORE_SHA" --after "$GITHUB_SHA"
